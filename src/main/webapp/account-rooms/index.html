<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>用户与房间管理</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 24px auto; padding: 0 16px; color: #222; }
        nav, section { margin-bottom: 18px; } fieldset { margin: 12px 0; padding: 14px; }
        label { display: inline-block; margin: 5px 10px 5px 0; } input, select, button { padding: 6px 8px; }
        button { cursor: pointer; } table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #bbb; padding: 7px; text-align: left; } th { background: #f2f2f2; }
        #message { min-height: 24px; padding: 8px; background: #f5f7fa; white-space: pre-wrap; }
        .hidden { display: none; } .danger { color: #a40000; } .ok { color: #087c36; }
    </style>
</head>
<body>
<nav><a href="../">返回首页</a></nav>
<h1>用户与房间管理</h1>
<p id="session">正在读取登录状态……</p>
<p id="message" aria-live="polite"></p>

<section>
    <fieldset><legend>注册</legend><form data-api="register">
        <label>用户名 <input name="username" required pattern="[A-Za-z0-9_]{3,32}"></label>
        <label>手机号 <input name="phone" required pattern="1[3-9][0-9]{9}"></label>
        <label>密码 <input name="password" type="password" required minlength="8"></label><button>注册</button>
    </form></fieldset>
    <fieldset><legend>登录 / 退出</legend><form data-api="login">
        <label>用户名 <input name="username" required></label><label>密码 <input name="password" type="password" required></label>
        <button>登录</button><button type="button" id="logout">退出</button>
    </form></fieldset>
    <fieldset><legend>模拟验证码重置密码</legend>
        <form id="reset-request"><label>用户名 <input name="username" required></label><label>手机号 <input name="phone" required></label><button>生成验证码</button></form>
        <form id="reset-confirm"><label>验证码 <input name="code" required maxlength="6"></label><label>新密码 <input name="new_password" type="password" required minlength="8"></label><button>重置密码</button></form>
    </fieldset>
</section>

<section><fieldset><legend>查询可预约房间</legend>
    <form id="search"><label>关键词 <input name="keyword" placeholder="房间名称或位置"></label><label>最少容纳人数 <input name="min_capacity" type="number" min="0" value="0"></label><button>查询</button></form>
    <table><thead><tr><th>编号</th><th>名称</th><th>位置</th><th>容量</th><th>开放时间</th></tr></thead><tbody id="rooms"></tbody></table>
</fieldset></section>

<section id="admin" class="hidden">
    <fieldset><legend>房管：新增或编辑房间</legend><form id="room-save">
        <label>房间编号 <input name="room_id" type="number" min="1" placeholder="新增时留空"></label>
        <label>名称 <input name="room_name" required></label><label>位置 <input name="location" required></label>
        <label>容量 <input name="capacity" type="number" min="1" required></label><label>开放时间 <input name="opening_hours" value="08:00-22:00" required></label>
        <label class="super-only">房管用户编号 <input name="manager_user_id" type="number" min="1"></label><button>保存</button>
    </form></fieldset>
    <fieldset><legend>房管：上下架与维护</legend><form id="room-status">
        <label>房间编号 <input name="room_id" type="number" min="1" required></label>
        <label>上架状态 <select name="listing_status"><option>LISTED</option><option>UNLISTED</option></select></label>
        <label>维护状态 <select name="maintenance_status"><option>NORMAL</option><option>MAINTENANCE</option></select></label><button>更新状态</button>
    </form><button id="admin-refresh">刷新管理列表</button>
    <table><thead><tr><th>编号</th><th>名称</th><th>位置</th><th>容量</th><th>开放时间</th><th>上架</th><th>维护</th><th>房管</th></tr></thead><tbody id="admin-rooms"></tbody></table>
    </fieldset>
</section>
<script src="account-rooms.js"></script>
</body>
</html>
