<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#315ddd"><title>研间 · 共享研讨间预约平台</title><link rel="stylesheet" href="app.css"><script src="app.js" defer></script></head>
<body>
<svg aria-hidden="true" width="0" height="0" style="position:absolute"><defs>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h7v7h-7z"/></symbol>
<symbol id="i-room" viewBox="0 0 24 24"><path d="M4 21V5l11-2v18M15 7h5v14M2 21h20M11 12v2"/></symbol>
<symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18m-13 4h2m4 0h2m-8 3h2"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9S4 17 4 12V6Z"/><path d="m8 12 3 3 5-6"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 15a3 3 0 0 1-3 3H9l-5 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3Z"/><path d="M8 8h8m-8 5h5"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="m10 3-1 3-3 1-3 3 2 2-1 3 3 3 3-1 2 2 3-1 2-3 3-1v-4l-3-1-1-3-3-1Z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4 2c-1.5 1-1.5 1.5-1.5 2m0 3h.01"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 0 1 14 0Z"/><circle cx="12" cy="10" r="2"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6m2 4c2 0 3 2 3 4v2"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 8a8 8 0 1 0 0 8m0-12v5h-5"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
</defs></svg>
<aside class="sidebar" aria-label="主导航">
  <a class="brand" href="#rooms"><span class="brand-mark"><svg class="icon"><use href="#i-room"/></svg></span><span class="brand-name">研间<small>STUDYROOM</small></span></a>
  <p class="nav-label">校园空间服务</p>
  <nav class="nav">
    <a href="#rooms" data-view="rooms"><svg class="icon"><use href="#i-grid"/></svg><span>探索空间</span></a>
    <a href="#orders" data-view="orders"><svg class="icon"><use href="#i-calendar"/></svg><span>我的预约</span></a>
    <a href="#credit" data-view="credit"><svg class="icon"><use href="#i-shield"/></svg><span>信用记录</span></a>
    <a href="#feedback" data-view="feedback"><svg class="icon"><use href="#i-chat"/></svg><span>反馈与申诉</span></a>
    <a href="#admin" data-view="admin" hidden><svg class="icon"><use href="#i-settings"/></svg><span>管理工作台</span></a>
    <a href="#help" data-view="help"><svg class="icon"><use href="#i-help"/></svg><span>使用指南</span></a>
  </nav>
  <div class="sidebar-bottom"><div class="side-note"><strong>让好想法，有处可谈。</strong>预约一间研讨室，<br>开启一场专注的交流。</div><a class="side-user" href="#account" id="side-user"><div class="avatar"><svg class="icon"><use href="#i-user"/></svg></div><div><b>我的账户</b><small>登录后开始预约</small></div><svg class="icon"><use href="#i-arrow"/></svg></a></div>
</aside>
<div class="workspace">
  <header class="topbar"><div class="topbar-title"><span class="mobile-brand">研间</span><span id="breadcrumb">探索空间</span></div><div class="topbar-right"><span class="date-label" id="today"></span><div id="header-auth"><button class="btn primary" data-action="login">登录 / 注册</button></div></div></header>
  <main class="content" id="content" tabindex="-1"><div class="loading"><span class="spinner"></span>正在加载空间</div></main>
</div>
<dialog id="modal" aria-labelledby="modal-title"><div class="modal-header"><h2 id="modal-title"></h2><button class="close" aria-label="关闭" data-action="close-modal">×</button></div><div class="modal-body" id="modal-body"></div></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<noscript>请启用 JavaScript 后使用预约平台。</noscript>
</body></html>
