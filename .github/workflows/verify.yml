name: Verify integrated studyroom
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  mysql-integration:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -pintegration-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      MYSQL_PWD: integration-only
      SWS_DB_URL: jdbc:mysql://127.0.0.1:3306/studyroom?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SWS_DB_USER: root
      SWS_DB_PASSWORD: integration-only
      SWS_INTEGRATION_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Create isolated schema and check repeatable migration
        run: |
          for script in db/init.sql db/prepare-legacy-account-rooms.sql db/account-rooms.sql db/booking-rules.sql db/usage-feedback.sql db/migrate-unified-fields.sql db/migrate-unified-fields.sql; do
            mysql --default-character-set=utf8mb4 -h 127.0.0.1 -u root < "$script"
          done
      - name: Check legacy database migration preserves records
        run: python3 scripts/check-migration.py
      - run: mvn --batch-mode clean verify
      - name: Run real MySQL integration checks
        run: |
          java -cp "target/test-classes:target/classes:target/studyroom/WEB-INF/lib/mysql-connector-j-8.4.0.jar:$HOME/.m2/repository/jakarta/servlet/jakarta.servlet-api/6.0.0/jakarta.servlet-api-6.0.0.jar" com.sws.studyroom.IntegrationChecks
      - name: Start Tomcat for browser integration
        run: |
          mysql -h 127.0.0.1 -u root studyroom -e "UPDATE room SET listing_status='LISTED' WHERE room_id=9101;"
          docker run -d --name studyroom-web --network host -e SWS_DB_URL -e SWS_DB_USER -e SWS_DB_PASSWORD -v "$PWD/target/studyroom.war:/usr/local/tomcat/webapps/studyroom.war:ro" tomcat:10.1-jdk17-temurin
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/studyroom/api/health; then exit 0; fi
            sleep 2
          done
          docker logs studyroom-web
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix /tmp/studyroom-browser --no-save playwright@1.56.1
          /tmp/studyroom-browser/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Check desktop and mobile flows in Chromium
        env:
          PLAYWRIGHT_MODULE: /tmp/studyroom-browser/node_modules/playwright
        run: node scripts/browser-checks.cjs
      - name: Save UI verification captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studyroom-ui-verification
          path: ui-verification/
          if-no-files-found: ignore
      - name: Server diagnostics on failure
        if: failure()
        run: docker logs studyroom-web || true
